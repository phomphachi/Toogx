<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Togg IVI Öncelikli Bypass Paneli</title>
<style>
  :root{
    --bg:#111a24; --fg:#fff; --muted:#b0bec5;
    --high:#00c853; --mid:#0288d1; --low:#546e7a; --lowest:#d32f2f;
    --card:#1c2d3d; --accent:#ffca28;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;text-align:center;padding:20px;background:var(--bg);color:var(--fg);margin:0;}
  h1{color:#00e5ff;font-size:22px;margin:0 0 4px;}
  p.sub{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .toolbar{max-width:340px;margin:0 auto 16px;display:flex;gap:8px;}
  .toolbar button{flex:1;padding:9px;border:none;border-radius:8px;background:#263849;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;}
  .toolbar button:focus-visible{outline:2px solid var(--accent);}
  .toolbar button.reset{background:#4a1d1d;}
  .section-title{font-size:13px;font-weight:bold;color:var(--accent);text-align:left;margin:22px auto 6px;max-width:340px;text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:3px;}
  .row{max-width:340px;margin:8px auto;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.4);}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;font-size:14px;font-weight:bold;color:#fff;text-align:left;text-decoration:none;}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:-2px;}
  .tier-high{background:var(--high);}
  .tier-mid{background:var(--mid);}
  .tier-low{background:var(--low);}
  .tier-lowest{background:var(--lowest);}
  .status{font-size:11px;font-weight:normal;opacity:.9;white-space:nowrap;}
  .note-wrap{padding:6px 12px 10px;background:rgba(0,0,0,.15);}
  .note{width:100%;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:#0d151d;color:#fff;}
  .note::placeholder{color:#5f7182;}
</style>
</head>
<body>

<h1>Togg IVI Öncelikli Bypass Paneli</h1>
<p class="sub">Sırayla dene — her denemenin sonucu otomatik işaretlenir, notlarını yazabilirsin.</p>

<div class="toolbar">
  <button onclick="exportState()">📋 Durumu kopyala</button>
  <button class="reset" onclick="resetState()">↺ Sıfırla</button>
</div>

<div id="app"></div>

<script>
const ITEMS = [
  {id:1,  tier:'high',   label:'Klavye / Sözlük Ayarları', action:'android.settings.USER_DICTIONARY_SETTINGS', hint:'En çok unutulan açık; arama ikonundan sisteme sızılabilir.'},
  {id:2,  tier:'high',   label:'Yedekleme ve Sıfırlama', action:'android.settings.BACKUP_AND_RESET_SETTINGS', hint:'Servis personeli için açık bırakılan menü.'},
  {id:3,  tier:'high',   label:'Google Hesap Ayarları', action:'com.google.android.gms.settings.GOOGLE_SETTINGS', hint:'GMS kurulu değilse resolve olmaz.'},
  {id:4,  tier:'high',   label:'Hesap Senkronizasyon Menüsü', action:'android.settings.SYNC_SETTINGS'},
  {id:5,  tier:'mid',    label:'Wi-Fi Ayarlarını Aç', action:'android.settings.WIFI_SETTINGS'},
  {id:6,  tier:'mid',    label:'Bluetooth Ayarlarını Aç', action:'android.settings.BLUETOOTH_SETTINGS'},
  {id:7,  tier:'mid',    label:'Diğer Kablosuz Ağlar', action:'android.settings.WIRELESS_SETTINGS'},
  {id:8,  tier:'mid',    label:'VPN Ayarlarını Aç', action:'android.settings.VPN_SETTINGS'},
  {id:9,  tier:'low',    label:'Hafıza / Depolama Ayarları', action:'android.settings.INTERNAL_STORAGE_SETTINGS', hint:'Açılırsa yerel Dosya Yöneticisine yönlendirir.'},
  {id:10, tier:'low',    label:'Güvenlik Ayarları', action:'android.settings.SECURITY_SETTINGS'},
  {id:11, tier:'low',    label:'Gizlilik Ayarları', action:'android.settings.PRIVACY_SETTINGS'},
  {id:12, tier:'lowest', label:'Tüm Uygulamalar Listesi', action:'android.settings.MANAGE_ALL_APPLICATIONS_SETTINGS'},
  {id:13, tier:'lowest', label:'Cihaz Hakkında Menüsü', action:'android.settings.DEVICE_INFO_SETTINGS'},
  {id:14, tier:'lowest', label:'Geliştirici Seçenekleri (Yol A)', action:'android.settings.APPLICATION_DEVELOPMENT_SETTINGS'},
  {id:15, tier:'lowest', label:'Geliştirici Seçenekleri (Yol B)', action:'android.settings.DEVELOPER_OPTIONS_SETTINGS'},
  {id:16, tier:'lowest', label:'Ana Ayarları Zorla', action:'android.settings.SETTINGS'},
];

const TIER_LABEL = {
  high:  '⭐ Seviye 1: En Yüksek İhtimal',
  mid:   '⚡ Seviye 2: Orta İhtimal',
  low:   '⚠️ Seviye 3: Düşük İhtimal',
  lowest:'🚫 Seviye 4: En Düşük İhtimal',
};

const STORE_KEY = 'togg_bypass_state_v1';

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ /* depolama yoksa sessizce yut */ }
}
let state = loadState();

function statusLabel(s){
  if(!s || !s.status) return '';
  if(s.status==='success') return '✓ açıldı';
  if(s.status==='fail')    return '✗ yanıt yok';
  if(s.status==='trying')  return '… deneniyor';
  return '';
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  let lastTier = null;
  ITEMS.forEach(item=>{
    if(item.tier !== lastTier){
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = TIER_LABEL[item.tier];
      app.appendChild(h);
      lastTier = item.tier;
    }
    const s = state[item.id] || {};

    const row = document.createElement('div');
    row.className = 'row';

    const baseUrl = location.href.split('#')[0];
    const fallback = encodeURIComponent(baseUrl + '#nores=' + item.id);
    const uri = `intent:#Intent;action=${item.action};S.browser_fallback_url=${fallback};end`;

    const a = document.createElement('a');
    a.className = 'btn tier-' + item.tier;
    a.href = uri;
    a.innerHTML = `<span>${item.id}. ${item.label}</span><span class="status" id="status-${item.id}">${statusLabel(s)}</span>`;
    a.addEventListener('click', ()=> onTry(item.id));
    row.appendChild(a);

    const noteWrap = document.createElement('div');
    noteWrap.className = 'note-wrap';
    const note = document.createElement('input');
    note.className = 'note';
    note.placeholder = item.hint || 'not ekle...';
    note.value = s.note || '';
    note.addEventListener('input', ()=>{
      state[item.id] = {...(state[item.id]||{}), note: note.value};
      saveState();
    });
    noteWrap.appendChild(note);
    row.appendChild(noteWrap);

    app.appendChild(row);
  });
}

function onTry(id){
  state[id] = {...(state[id]||{}), status:'trying', lastTried: Date.now()};
  saveState();
  updateStatus(id);
  setTimeout(()=>{
    if(document.hidden){
      state[id] = {...(state[id]||{}), status:'success'};
    } else if((state[id]||{}).status === 'trying'){
      state[id] = {...(state[id]||{}), status:'fail'};
    }
    saveState();
    updateStatus(id);
  }, 900);
}

function updateStatus(id){
  const el = document.getElementById('status-' + id);
  if(el) el.textContent = statusLabel(state[id]);
}

(function checkFallback(){
  const m = location.hash.match(/nores=(\d+)/);
  if(m){
    const id = m[1];
    state[id] = {...(state[id]||{}), status:'fail'};
    saveState();
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden){
    let changed = false;
    Object.keys(state).forEach(id=>{
      if(state[id].status === 'trying'){
        state[id].status = 'success';
        changed = true;
      }
    });
    if(changed){ saveState(); render(); }
  }
});

function resetState(){
  if(confirm('Tüm işaretlemeler ve notlar silinsin mi?')){
    state = {};
    saveState();
    render();
  }
}

function exportState(){
  const txt = JSON.stringify(state, null, 2);
  navigator.clipboard.writeText(txt).then(()=>{
    alert('Durum panoya kopyalandı!');
  }).catch(()=>{
    alert('Kopyalanamadı: \n' + txt);
  });
}

render();
</script>
</body>
</html>
