<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Togg IVI Öncelikli Bypass Paneli</title>
<style>
  :root{
    --bg:#111a24; --fg:#fff; --muted:#b0bec5;
    --high:#00c853; --mid:#0288d1; --low:#546e7a; --lowest:#d32f2f;
    --card:#1c2d3d; --accent:#ffca28;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;text-align:center;padding:20px;background:var(--bg);color:var(--fg);margin:0;}
  h1{color:#00e5ff;font-size:22px;margin:0 0 4px;}
  p.sub{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .toolbar{max-width:340px;margin:0 auto 16px;display:flex;gap:8px;}
  .toolbar button{flex:1;padding:9px;border:none;border-radius:8px;background:#263849;color:#fff;font-size:12px;font-weight:bold;cursor:pointer;}
  .toolbar button:focus-visible{outline:2px solid var(--accent);}
  .toolbar button.reset{background:#4a1d1d;}
  .section-title{font-size:13px;font-weight:bold;color:var(--accent);text-align:left;margin:22px auto 6px;max-width:340px;text-transform:uppercase;border-bottom:2px solid var(--accent);padding-bottom:3px;}
  .row{max-width:340px;margin:8px auto;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.4);}
  .btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 14px;font-size:14px;font-weight:bold;color:#fff;text-align:left;text-decoration:none;}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:-2px;}
  .tier-high{background:var(--high);}
  .tier-mid{background:var(--mid);}
  .tier-low{background:var(--low);}
  .tier-lowest{background:var(--lowest);}
  .status{font-size:11px;font-weight:normal;opacity:.9;white-space:nowrap;}
  .note-wrap{padding:6px 12px 10px;background:rgba(0,0,0,.15);}
  .note{width:100%;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:#0d151d;color:#fff;}
  .note::placeholder{color:#5f7182;}
