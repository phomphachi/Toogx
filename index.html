<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Togg IVI — Grafik Bypass Paneli v3</title>
<style>
  :root {
    --bg: #0d1520;
    --fg: #f0f4f8;
    --muted: #8b9cb3;
    --card: #1a2736;
    --accent: #00e5ff;
    --ok: #00c853;
    --bad: #ef5350;
    --try: #29b6f6;
    --warn: #ffca28;
    --fuzz: #7c4dff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding: 14px 12px 50px;
    text-align: center;
    line-height: 1.4;
  }
  h1 { color: var(--accent); font-size: 18px; margin-bottom: 2px; }
  .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .stats {
    display: flex; justify-content: center; gap: 16px;
    font-size: 12px; margin-bottom: 12px; color: var(--muted);
  }
  .stats b { color: var(--fg); }
  .toolbar {
    max-width: 460px; margin: 0 auto 14px;
    display: flex; flex-wrap: wrap; gap: 7px;
  }
  .toolbar button {
    flex: 1 1 28%; min-width: 85px; padding: 10px 5px;
    border: none; border-radius: 8px; background: #263849;
    color: #fff; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .toolbar button.primary { background: #00695c; }
  .toolbar button.fuzz { background: var(--fuzz); }
  .toolbar button.reset { background: #4a1d1d; }
  .toolbar button:active { opacity: 0.85; }

  .section-title {
    font-size: 12px; font-weight: 700; color: var(--warn);
    text-align: left; margin: 18px auto 6px; max-width: 460px;
    text-transform: uppercase; border-bottom: 2px solid var(--warn);
    padding-bottom: 3px; letter-spacing: 0.3px;
  }
  .row {
    max-width: 460px; margin: 6px auto; background: var(--card);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
  }
  .btn-row { display: flex; align-items: stretch; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 12px; font-size: 13px; font-weight: 600;
    color: #fff; text-align: left; text-decoration: none; border: none; cursor: pointer;
  }
  .tier-high { background: var(--ok); }
  .tier-mid  { background: var(--try); }
  .tier-low  { background: var(--bad); }
  .status { font-size: 11px; font-weight: 500; opacity: 0.95; white-space: nowrap; }
  .copy-btn {
    background: rgba(0,0,0,0.25); border: none; color: #fff;
    padding: 0 11px; font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .note-wrap { padding: 4px 12px 8px; background: rgba(0,0,0,0.18); }
  .note { font-size: 11px; color: #b3d4fc; text-align: left; }

  /* Custom + Component + Extra */
  .custom-box {
    max-width: 460px; margin: 20px auto 0; background: var(--card);
    border-radius: 10px; padding: 14px; text-align: left;
  }
  .custom-box h3 {
    font-size: 13px; color: var(--accent); margin-bottom: 10px;
  }
  .custom-box label {
    display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px;
  }
  .custom-box input, .custom-box select {
    width: 100%; padding: 9px 10px; border-radius: 6px;
    border: 1px solid #334; background: #0d151d; color: #fff; font-size: 13px;
  }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .custom-box button {
    width: 100%; padding: 11px; margin-top: 10px; border: none;
    border-radius: 8px; background: #00695c; color: #fff;
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  .custom-box button.fuzz-btn { background: var(--fuzz); margin-top: 6px; }

  .log-box {
    max-width: 460px; margin: 16px auto 0; background: #0a1018;
    border-radius: 10px; padding: 12px; text-align: left;
    max-height: 170px; overflow-y: auto; font-size: 11px; color: #90a4ae;
  }
  .log-box div { margin-bottom: 3px; }
  .log-ok { color: #69f0ae; }
  .log-fail { color: #ef9a9a; }
  .log-try { color: #81d4fa; }
  .log-fuzz { color: #b388ff; }
</style>
</head>
<body>

<h1>Togg IVI — Grafik Bypass Paneli v3</h1>
<p class="sub">Component + Extra + Fuzz Mode destekli</p>

<div class="stats">
  <span>✓ <b id="cnt-ok">0</b></span>
  <span>✗ <b id="cnt-fail">0</b></span>
  <span>… <b id="cnt-try">0</b></span>
</div>

<div class="toolbar">
  <button class="primary" onclick="autoSequence()">▶ Otomatik</button>
  <button class="fuzz" onclick="startFuzzFromList()">⚡ Fuzz (Liste)</button>
  <button onclick="exportState()">📋 Kopyala</button>
  <button class="reset" onclick="clearAll()">↺ Sıfırla</button>
</div>

<div id="app"></div>

<!-- Özel Intent + Component + Extra -->
<div class="custom-box">
  <h3>Özel Intent (Component + Extra)</h3>

  <label>Action (opsiyonel)</label>
  <input type="text" id="c-action" placeholder="android.settings.SETTINGS" value="android.settings.SETTINGS">

  <label>Component (Paket/Sınıf) — Örnek: com.android.settings/.Settings</label>
  <input type="text" id="c-component" placeholder="com.android.settings/.Settings" value="">

  <label>Launch Flags</label>
  <select id="c-flags">
    <option value="">Flag yok</option>
    <option value="0x10000000">NEW_TASK (0x10000000)</option>
    <option value="0x00080000">CLEAR_TOP (0x00080000)</option>
    <option value="0x10008000" selected>LAUNCH_ADJACENT (0x10008000)</option>
    <option value="0x20000000">MULTIPLE_TASK (0x20000000)</option>
    <option value="0x08000000">REORDER_TO_FRONT</option>
    <option value="0x40000000">NO_ANIMATION benzeri</option>
    <option value="0x10000000|0x00080000">NEW_TASK + CLEAR_TOP</option>
  </select>

  <label>Extra Parametre</label>
  <div class="row2">
    <input type="text" id="c-extra-key" placeholder="Anahtar (örn: extra_prefs_show_button_bar)">
    <input type="text" id="c-extra-val" placeholder="Değer (örn: true)">
  </div>
  <select id="c-extra-type" style="margin-top:6px;">
    <option value="S">String (S.)</option>
    <option value="B" selected>Boolean (B.)</option>
    <option value="i">Integer (i.)</option>
    <option value="l">Long (l.)</option>
  </select>

  <button onclick="tryCustom()">Özel Intent’i Tetikle</button>
  <button class="fuzz-btn" onclick="startFuzzCustom()">⚡ Fuzz Mode (Bu Intent)</button>
</div>

<div class="log-box" id="log">
  <div style="color:#607d8b">Deneme geçmişi burada görünecek…</div>
</div>

<script>
const ITEMS = [
  {id:1,  tier:'high', label:'Klavye / Sözlük (Overlay)', action:'android.settings.USER_DICTIONARY_SETTINGS', flags:'', hint:'Sistem overlay katmanı'},
  {id:2,  tier:'high', label:'Yedekleme & Sıfırlama', action:'android.settings.BACKUP_AND_RESET_SETTINGS', flags:'0x00080000', hint:'CLEAR_TOP ile thumbnail zorlama'},
  {id:3,  tier:'high', label:'Erişilebilirlik', action:'android.settings.ACCESSIBILITY_SETTINGS', flags:'0x10000000', hint:'Sistem UI servisleri'},
  {id:4,  tier:'high', label:'Ekran Ayarları', action:'android.settings.DISPLAY_SETTINGS', flags:'0x10000000', hint:'Display manager'},
  {id:5,  tier:'mid',  label:'Ana Ayarlar (Split)', action:'android.settings.SETTINGS', flags:'0x10008000', hint:'LAUNCH_ADJACENT'},
  {id:6,  tier:'mid',  label:'Geliştirici Seçenekleri', action:'android.settings.APPLICATION_DEVELOPMENT_SETTINGS', flags:'0x40000000', hint:'PiP / özel pencere'},
  {id:7,  tier:'mid',  label:'Bildirim Ayarları', action:'android.settings.NOTIFICATION_SETTINGS', flags:'0x10000000', hint:'Notification shade'},
  {id:8,  tier:'mid',  label:'Uygulama Bildirimleri', action:'android.settings.ACTION_APP_NOTIFICATION_SETTINGS', flags:'0x10000000', hint:'App notification'},
  {id:9,  tier:'low',  label:'Wi-Fi', action:'android.settings.WIFI_SETTINGS', flags:'0x10000000', hint:'Ağ pencereleri'},
  {id:10, tier:'low',  label:'Bluetooth', action:'android.settings.BLUETOOTH_SETTINGS', flags:'0x20000000', hint:'Eşleşme dialog'},
  {id:11, tier:'low',  label:'Ses Ayarları', action:'android.settings.SOUND_SETTINGS', flags:'0x10000000', hint:'Ses paneli'},
  {id:12, tier:'low',  label:'Uygulama Listesi', action:'android.settings.APPLICATION_SETTINGS', flags:'0x10000000', hint:'Uygulama yöneticisi'}
];

const TIER_LABEL = {
  high: '⭐ Seviye 1 — Yüksek Potansiyel',
  mid:  '⚡ Seviye 2 — Grafik & Bölünmüş Ekran',
  low:  '⚠️ Seviye 3 — Yan Kontroller'
};

const FUZZ_FLAGS = [
  '0x10000000',          // NEW_TASK
  '0x00080000',          // CLEAR_TOP
  '0x10008000',          // LAUNCH_ADJACENT
  '0x20000000',          // MULTIPLE_TASK
  '0x08000000',          // REORDER_TO_FRONT
  '0x40000000',          // (NO_ANIMATION benzeri)
  '0x10000000|0x00080000',
  '0x10008000|0x00080000'
];

const STORE_KEY = 'togg_graphics_bypass_v3';
let state = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let log = [];
let autoRunning = false;
let fuzzRunning = false;

function buildIntent({action, component, flags, extraKey, extraVal, extraType}) {
  const base = location.href.split('#')[0];
  const fallback = encodeURIComponent(base + '#nores=' + Date.now());
  let parts = ['#Intent'];

  if (action) parts.push(`action=${action}`);
  if (component) parts.push(`component=${component}`);
  if (flags) parts.push(`launchFlags=${flags}`);

  if (extraKey && extraVal !== '') {
    const type = extraType || 'S';
    parts.push(`\( {type}. \){extraKey}=${extraVal}`);
  }

  parts.push(`S.browser_fallback_url=${fallback}`);
  parts.push('end');
  return 'intent:' + parts.join(';');
}

function statusLabel(s) {
  if (!s || !s.status) return '';
  if (s.status === 'success') return '✓ tetiklendi';
  if (s.status === 'fail')    return '✗ yanıt yok';
  if (s.status === 'trying')  return '… deneniyor';
  return '';
}

function updateCounters() {
  let ok=0, fail=0, trying=0;
  Object.values(state).forEach(s => {
    if (s.status === 'success') ok++;
    else if (s.status === 'fail') fail++;
    else if (s.status === 'trying') trying++;
  });
  document.getElementById('cnt-ok').textContent = ok;
  document.getElementById('cnt-fail').textContent = fail;
  document.getElementById('cnt-try').textContent = trying;
}

function addLog(msg, type='') {
  const time = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  log.unshift({time, msg, type});
  if (log.length > 50) log.pop();
  const box = document.getElementById('log');
  box.innerHTML = log.map(l => `<div class="log-\( {l.type}">[ \){l.time}] ${l.msg}</div>`).join('');
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  let lastTier = null;

  ITEMS.forEach(item => {
    if (item.tier !== lastTier) {
      const h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = TIER_LABEL[item.tier];
      app.appendChild(h);
      lastTier = item.tier;
    }

    const s = state[item.id] || {};
    const row = document.createElement('div');
    row.className = 'row';

    const btnRow = document.createElement('div');
    btnRow.className = 'btn-row';

    const a = document.createElement('a');
    a.className = 'btn tier-' + item.tier;
    a.href = buildIntent({action: item.action, flags: item.flags});
    a.innerHTML = `<span>${item.id}. \( {item.label}</span><span class="status" id="status- \){item.id}">${statusLabel(s)}</span>`;
    a.addEventListener('click', () => onTry(item.id, item.label));
    btnRow.appendChild(a);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'URI';
    copyBtn.onclick = (e) => {
      e.preventDefault(); e.stopPropagation();
      const uri = buildIntent({action: item.action, flags: item.flags});
      navigator.clipboard.writeText(uri)
        .then(() => addLog(`URI kopyalandı: ${item.label}`, 'try'))
        .catch(() => alert('Kopyalanamadı'));
    };
    btnRow.appendChild(copyBtn);

    row.appendChild(btnRow);
    const noteWrap = document.createElement('div');
    noteWrap.className = 'note-wrap';
    noteWrap.innerHTML = `<div class="note">${item.hint || ''}</div>`;
    row.appendChild(noteWrap);
    app.appendChild(row);
  });
  updateCounters();
}

function onTry(id, label) {
  state[id] = {status:'trying', lastTried: Date.now()};
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
  updateStatus(id); updateCounters();
  addLog(`${id}. ${label} deneniyor…`, 'try');

  const check = () => {
    if (document.hidden || document.visibilityState === 'hidden') {
      state[id] = {status:'success', lastTried: Date.now()};
      addLog(`${id}. ${label} → BAŞARILI`, 'ok');
    } else if (state[id]?.status === 'trying') {
      state[id] = {status:'fail', lastTried: Date.now()};
      addLog(`${id}. ${label} → yanıt yok`, 'fail');
    }
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    updateStatus(id); updateCounters();
  };

  const t = setTimeout(check, 1100);
  const visHandler = () => {
    if (document.hidden) {
      clearTimeout(t);
      check();
      document.removeEventListener('visibilitychange', visHandler);
    }
  };
  document.addEventListener('visibilitychange', visHandler);
}

function updateStatus(id) {
  const el = document.getElementById('status-' + id);
  if (el) el.textContent = statusLabel(state[id]);
}

(function(){
  if (location.hash.includes('nores=')) {
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

function clearAll() {
  if (confirm('Tüm durum ve log temizlensin mi?')) {
    state = {}; log = [];
    localStorage.removeItem(STORE_KEY);
    document.getElementById('log').innerHTML = '<div style="color:#607d8b">Temizlendi.</div>';
    render();
  }
}

function exportState() {
  const data = {state, log: log.slice(0,25), time: new Date().toISOString()};
  navigator.clipboard.writeText(JSON.stringify(data, null, 2))
    .then(() => alert('Durum + log kopyalandı!'))
    .catch(() => alert('Kopyalanamadı'));
}

async function autoSequence() {
  if (autoRunning) return;
  autoRunning = true;
  addLog('▶ Otomatik sıralı deneme başladı', 'try');
  for (const item of ITEMS) {
    if (!autoRunning) break;
    if (state[item.id]?.status === 'success') continue;
    const link = document.querySelector(`a[href*="${item.action}"]`);
    if (link) {
      link.click();
      await new Promise(r => setTimeout(r, 1500));
    }
  }
  autoRunning = false;
  addLog('Otomatik deneme tamamlandı', 'ok');
}

function getCustomParams() {
  return {
    action: document.getElementById('c-action').value.trim(),
    component: document.getElementById('c-component').value.trim(),
    flags: document.getElementById('c-flags').value,
    extraKey: document.getElementById('c-extra-key').value.trim(),
    extraVal: document.getElementById('c-extra-val').value.trim(),
    extraType: document.getElementById('c-extra-type').value
  };
}

function tryCustom() {
  const p = getCustomParams();
  if (!p.action && !p.component) return alert('Action veya Component gerekli');
  const uri = buildIntent(p);
  addLog(`Özel → ${p.component || p.action}`, 'try');
  location.href = uri;
  setTimeout(() => {
    if (document.hidden) addLog('Özel intent → başarılı görünüyor', 'ok');
    else addLog('Özel intent → yanıt yok', 'fail');
  }, 1100);
}

async function startFuzzCustom() {
  if (fuzzRunning) return;
  const p = getCustomParams();
  if (!p.action && !p.component) return alert('Action veya Component gerekli');

  fuzzRunning = true;
  addLog('⚡ FUZZ MODE başladı (Custom)', 'fuzz');

  for (let i = 0; i < FUZZ_FLAGS.length; i++) {
    if (!fuzzRunning) break;
    const flags = FUZZ_FLAGS[i];
    const uri = buildIntent({...p, flags});
    addLog(`Fuzz [\( {i+1}/ \){FUZZ_FLAGS.length}] flag=${flags}`, 'fuzz');
    location.href = uri;
    await new Promise(r => setTimeout(r, 80)); // 70-90ms arası hızlı ateş
  }

  fuzzRunning = false;
  addLog('⚡ Fuzz tamamlandı', 'fuzz');
}

async function startFuzzFromList() {
  if (fuzzRunning) return;
  fuzzRunning = true;
  addLog('⚡ FUZZ MODE (Liste) başladı', 'fuzz');

  // En yüksek potansiyelli 4 taneyi hızlıca flag’lerle dene
  const targets = ITEMS.filter(i => i.tier === 'high' || i.tier === 'mid').slice(0, 5);

  for (const item of targets) {
    if (!fuzzRunning) break;
    for (const flags of FUZZ_FLAGS.slice(0, 5)) {
      if (!fuzzRunning) break;
      const uri = buildIntent({action: item.action, flags});
      addLog(`Fuzz ${item.label} → ${flags}`, 'fuzz');
      location.href = uri;
      await new Promise(r => setTimeout(r, 75));
    }
  }

  fuzzRunning = false;
  addLog('⚡ Liste Fuzz tamamlandı', 'fuzz');
}

render();
</script>
</body>
</html>
